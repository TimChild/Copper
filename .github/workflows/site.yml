# Keep https://copper-browser.github.io/Copper/ in step with site/.
# Pages serves the gh-pages branch (legacy source, path /); this job rebuilds
# that branch as `git subtree split --prefix site` of the pushed commit, so
# gh-pages only ever holds the site's own files and history.
name: site
on:
  push:
    branches: [fork]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch: {}
permissions: { contents: write }
concurrency: { group: site-pages, cancel-in-progress: true }
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - name: split site/ and push gh-pages
        run: |
          set -euo pipefail
          test -f site/index.html
          split="$(git subtree split -q --prefix site HEAD)"
          echo "site/ at ${GITHUB_SHA} → ${split}"
          git push --force origin "${split}:refs/heads/gh-pages"
          echo "published ${split} → https://copper-browser.github.io/Copper/" >> "$GITHUB_STEP_SUMMARY"
