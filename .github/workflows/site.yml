# Deploy site/ to https://copper-browser.github.io/Copper/ with GitHub Pages
# (Settings → Pages → Source: GitHub Actions). A push to fork that touches
# site/ checks it and deploys it; a PR that touches site/ only gets checked.
name: site
on:
  push:
    branches: [fork]
    paths: ["site/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch: {}
permissions: { contents: read }
concurrency:
  group: site-${{ github.event_name == 'pull_request' && github.ref || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: check every asset the page references exists
        run: |
          set -euo pipefail
          test -f site/index.html
          missing=0
          while read -r f; do
            [ -f "site/$f" ] || { echo "::error file=site/index.html::missing site/$f"; missing=1; }
          done < <(grep -oE 'assets/[A-Za-z0-9._/-]+' site/index.html | sort -u)
          exit "$missing"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: site }

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/fork'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { pages: write, id-token: write }
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
