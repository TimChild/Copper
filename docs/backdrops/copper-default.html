<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head><body>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
// Copper's default sidebar: the app icon's copper plate and verdigris patina,
// lightened to a pale rose-copper ground with soft teal ribbons running on a
// diagonal, a little brushed-metal sheen, and nothing dark enough to fight text.
const q = new URLSearchParams(location.search);
const W = +q.get('w') || 900, H = +q.get('h') || 3200, soft = +(q.get('soft') ?? 0.4), seed = +(q.get('seed') ?? 2.3);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H); document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(), camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const mat = new THREE.ShaderMaterial({
  uniforms: { uAspect: { value: H / W }, uSoft: { value: soft }, uSeed: { value: seed } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader: `
  precision highp float; varying vec2 vUv; uniform float uAspect,uSoft,uSeed;
  vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;} vec4 mod289(vec4 x){return x-floor(x*(1./289.))*289.;}
  vec4 permute(vec4 x){return mod289(((x*34.)+1.)*x);} vec4 tis(vec4 r){return 1.79284291400159-.85373472095314*r;}
  float snoise(vec3 v){const vec2 C=vec2(1./6.,1./3.);const vec4 D=vec4(0.,.5,1.,2.);
    vec3 i=floor(v+dot(v,C.yyy));vec3 x0=v-i+dot(i,C.xxx);vec3 g=step(x0.yzx,x0.xyz);vec3 l=1.-g;vec3 i1=min(g.xyz,l.zxy);vec3 i2=max(g.xyz,l.zxy);
    vec3 x1=x0-i1+C.xxx;vec3 x2=x0-i2+C.yyy;vec3 x3=x0-D.yyy;i=mod289(i);
    vec4 p=permute(permute(permute(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));
    float n_=.142857142857;vec3 ns=n_*D.wyz-D.xzx;vec4 j=p-49.*floor(p*ns.z*ns.z);vec4 x_=floor(j*ns.z);vec4 y_=floor(j-7.*x_);
    vec4 x=x_*ns.x+ns.yyyy;vec4 y=y_*ns.x+ns.yyyy;vec4 h=1.-abs(x)-abs(y);vec4 b0=vec4(x.xy,y.xy);vec4 b1=vec4(x.zw,y.zw);
    vec4 s0=floor(b0)*2.+1.;vec4 s1=floor(b1)*2.+1.;vec4 sh=-step(h,vec4(0.));vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
    vec3 p0=vec3(a0.xy,h.x);vec3 p1=vec3(a0.zw,h.y);vec3 p2=vec3(a1.xy,h.z);vec3 p3=vec3(a1.zw,h.w);
    vec4 nm=tis(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));p0*=nm.x;p1*=nm.y;p2*=nm.z;p3*=nm.w;
    vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.);m=m*m;return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));}
  vec3 hex(float r,float g,float b){return vec3(r,g,b)/255.;}
  void main(){
    vec2 p=vec2(vUv.x,vUv.y*uAspect);
    float ang=-0.55; mat2 rot=mat2(cos(ang),-sin(ang),sin(ang),cos(ang));
    vec2 d=rot*(p-vec2(.5,.5*uAspect)); float u=d.y, v=d.x;
    u+=.06*snoise(vec3(p*.6,uSeed));
    vec3 cols[6];
    cols[0]=hex(246.,232.,222.);  // pale copper cream
    cols[1]=hex(234.,196.,170.);  // rose copper
    cols[2]=hex(196.,226.,214.);  // verdigris mist
    cols[3]=hex(214.,160.,128.);  // polished copper
    cols[4]=hex(158.,208.,196.);  // patina teal
    cols[5]=hex(200.,214.,232.);  // faint lapis
    vec3 col=cols[0]; float spacing=uAspect/5.;
    for(int k=1;k<12;k++){ float fk=float(k);
      float edge=-uAspect*.72+fk*spacing*.62+.12*sin(v*2.0+fk*1.9+uSeed)+.05*sin(v*4.1-fk*.7+uSeed*2.);
      float over=smoothstep(edge-.008,edge+.008,u);
      float shade=1.-.06*exp(-max(0.,edge-u)*34.)*step(u,edge);
      vec3 rib=cols[k%6]; float across=clamp((u-edge)/(spacing*.62),0.,1.);
      rib=mix(rib,hex(250.,242.,236.),.22*across);
      col=mix(col*shade,rib,over); }
    // Brushed-metal sheen: fine streaks along the ribbons.
    float streak=snoise(vec3(v*1.5,u*90.,uSeed+4.));
    col+=.018*streak;
    col=mix(col,hex(248.,240.,234.),clamp(uSoft+.2*smoothstep(.6,1.,vUv.y),0.,.9));
    gl_FragColor=vec4(clamp(col,0.,1.),1.);
  }`,
});
scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat)); renderer.render(scene, camera); window.__done = true;
</script></body></html>
